name: Sync Branches

# Gabungkan satu branch ke branch lain (mis. model_history -> Master)
# dengan auto-resolve konflik README.md / research_log.md / .pyc.
# Jalankan manual dari tab Actions -> "Sync Branches" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Branch sumber (case-sensitive)"
        required: true
        default: "model_history"
      target:
        description: "Branch tujuan (case-sensitive)"
        required: true
        default: "Master"

permissions:
  contents: write

concurrency:
  # Pakai grup yang sama dengan update_registry di branch target supaya
  # tidak push bersamaan ke branch yang sama.
  group: registry-update-${{ inputs.target }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Merge and push
        run: |
          python scripts/sync_branches.py \
            --source "${{ inputs.source }}" \
            --target "${{ inputs.target }}" \
            --allow-dirty \
            --push
