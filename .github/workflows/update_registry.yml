name: Update Experiment Registry

on:
  push:
    paths:
      - 'registry/**/*.json'
      - '*.ipynb'           # Trigger menyala jika file notebook masuk ke root
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  update-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract Registry and Move Notebooks
        run: python scripts/extract_registry.py

      - name: Validate registry
        run: python scripts/validate_registry.py
        
      - name: Generate README
        run: |
          python scripts/generate_readme.py

      - name: Generate research log
        run: |
          python scripts/generate_research_log.py

      - name: Commit generated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto-update registry and move notebook" || echo "No changes to commit"
          git push
