name: Update Experiment Registry

# Berjalan di branch mana pun yang menerima push dari Kaggle
# (Master maupun model_history). Setiap branch diproses sendiri-sendiri
# dan hasilnya di-push kembali ke branch YANG SAMA.
on:
  push:
    paths:
      - 'registry/**/*.json'
      - '*.ipynb'           # Notebook dari Kaggle masuk ke root
      - 'scripts/**'
      - '.github/workflows/update_registry.yml'
  workflow_dispatch:

permissions:
  contents: write

# Antrian per-branch. Versi lama memakai satu grup untuk semua branch,
# sehingga run Master & model_history saling membatalkan antrian.
concurrency:
  group: registry-update-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BRANCH: ${{ github.ref_name }}
  # Mencegah scripts/__pycache__/*.pyc terbuat lalu ikut ter-commit
  # (file biner itu penyebab konflik merge yang tidak bisa auto-resolve).
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  update-registry:
    runs-on: ubuntu-latest
    # Jangan proses commit buatan bot sendiri (mencegah loop).
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Update registry, commit, and push (with retry)
        shell: bash
        run: |
          set -euo pipefail

          # Catatan: `|| exit 1` wajib, karena `set -e` tidak berlaku di
          # dalam fungsi yang dipanggil lewat `if ! build_and_commit`.
          build_and_commit() {
            # Hapus .pyc lama yang pernah ter-commit dari index (sekali saja,
            # setelah itu .gitignore mencegahnya masuk lagi).
            git rm -r -q --cached --ignore-unmatch scripts/__pycache__

            python scripts/extract_registry.py || exit 1
            python scripts/validate_registry.py || exit 1
            python scripts/generate_readme.py || exit 1
            python scripts/generate_research_log.py || exit 1

            # Commit HANYA file yang memang dihasilkan pipeline
            # (versi lama memakai `git add -A` sehingga .pyc ikut masuk).
            git add -A -- registry experiments README.md research_log.md
            git add -u -- '*.ipynb'      # notebook root yang sudah dipindah
            git rm -r -q --cached --ignore-unmatch scripts/__pycache__

            if git diff --cached --quiet; then
              echo "No changes to commit"
              return 1
            fi

            git commit -m "Auto-update registry and move notebook [${BRANCH}]"
          }

          if ! build_and_commit; then
            exit 0
          fi

          # Push ke branch yang sama. Bila ditolak karena Kaggle/teman
          # push lebih dulu, ambil versi terbaru lalu ulangi pipeline
          # dari awal -> tidak pernah ada konflik rebase.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Push ke ${BRANCH} berhasil."
              exit 0
            fi

            echo "Push ditolak (percobaan ${attempt}/5). Sinkron ulang dengan origin/${BRANCH}..."
            sleep $((attempt * 3))
            git fetch origin "${BRANCH}"
            git reset -q --hard "origin/${BRANCH}"

            if ! build_and_commit; then
              echo "Remote sudah up to date."
              exit 0
            fi
          done

          echo "Gagal push ke ${BRANCH} setelah 5 percobaan." >&2
          exit 1
