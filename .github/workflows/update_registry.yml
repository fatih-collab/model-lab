name: Update Experiment Registry

on:
  push:
    paths:
      - 'registry/**/*.json'
      - 'experiments/**/*.ipynb'  # Tambahkan baris ini
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: registry-update
  cancel-in-progress: false

jobs:
  update-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract Registry from incoming Notebooks
        run: python scripts/extract_registry.py

      - name: Validate registry
        run: python scripts/validate_registry.py
        
      - name: Generate README
        run: |
          python scripts/generate_readme.py

      - name: Generate research log
        run: |
          python scripts/generate_research_log.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md research_log.md

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update experiment dashboard"
            git push
          fi
