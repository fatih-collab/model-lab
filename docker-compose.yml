# GlowMatch — 12-Season Personal Color Analysis
#   docker compose up -d --build                      -> http://localhost:8080
#   DOMAIN=glowmatch.example.com docker compose --profile tls up -d --build   -> https://DOMAIN
# Panduan lengkap: DEPLOYMENT.md
name: glowmatch

services:
  api:
    build: ./backend
    image: glowmatch-api:latest
    restart: unless-stopped
    environment:
      GLOWMATCH_TORCH_THREADS: ${TORCH_THREADS:-0}
      GLOWMATCH_MAX_FOLDS: ${MAX_FOLDS:-0}
      GLOWMATCH_WHITE_BALANCE: ${WHITE_BALANCE:-1}
      GLOWMATCH_WB_STRENGTH: ${WB_STRENGTH:-1.0}
      GLOWMATCH_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      GLOWMATCH_DEVICE: ${GLOWMATCH_DEVICE:-cpu}
      GLOWMATCH_DATABASE_URL: ${GLOWMATCH_DATABASE_URL:-}
      GLOWMATCH_CORS_ORIGINS: ${GLOWMATCH_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
      # Chat AI (9router). Di dalam container, 9router di host diakses via host.docker.internal.
      # Sengaja variabel terpisah: GLOWMATCH_AI_BASE_URL di .env berisi localhost untuk dev non-Docker.
      GLOWMATCH_AI_BASE_URL: ${DOCKER_AI_BASE_URL:-http://host.docker.internal:20128/v1}
      GLOWMATCH_AI_API_KEY: ${GLOWMATCH_AI_API_KEY:-}
      GLOWMATCH_AI_MODEL: ${GLOWMATCH_AI_MODEL:-}
      GLOWMATCH_AI_MAX_TOKENS: ${GLOWMATCH_AI_MAX_TOKENS:-1500}
      GLOWMATCH_AI_TIMEOUT: ${GLOWMATCH_AI_TIMEOUT:-45}
      GLOWMATCH_AI_RATE_LIMIT: ${GLOWMATCH_AI_RATE_LIMIT:-20}
      GLOWMATCH_OUTFIT_IMAGE_URL: ${GLOWMATCH_OUTFIT_IMAGE_URL-https://image.pollinations.ai/prompt/{prompt}?width=512&height=640&nologo=true&seed={seed}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Diisi di host dengan backend/scripts/extract_models.py (lihat DEPLOYMENT.md)
      - ./backend/models/undertone:/app/models/undertone:ro
      - ./backend/models/season:/app/models/season:ro
      - ./backend/models/pyfacer:/app/models/pyfacer:ro
      - ./backend/models/hf_cache:/app/models/hf_cache
    expose:
      - "8000"
    mem_limit: ${API_MEMORY:-4g}

  # Migrasi skema database sekali jalan: docker compose --profile migrate run --rm migrate
  migrate:
    build: ./backend
    image: glowmatch-api:latest
    profiles: ["migrate"]
    restart: "no"
    environment:
      GLOWMATCH_MIGRATION_DATABASE_URL: ${GLOWMATCH_MIGRATION_DATABASE_URL:-}
      GLOWMATCH_LOAD_MODELS: "0"
    command: ["alembic", "upgrade", "head"]

  # PostgreSQL lokal opsional (jika tidak memakai Neon): docker compose --profile local-db up -d
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glowmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glowmatch_dev}
      POSTGRES_DB: ${POSTGRES_DB:-glowmatch}
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glowmatch} -d ${POSTGRES_DB:-glowmatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./model-lab-Front-end
    image: glowmatch-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # HTTPS otomatis (Let's Encrypt). Kamera browser hanya jalan di HTTPS atau localhost.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
