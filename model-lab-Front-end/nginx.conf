server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Foto wajah & pergelangan (JPEG ~0.2-1 MB); backend menolak > 8 MB.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend FastAPI. /api/analyze bisa butuh beberapa detik di CPU -> timeout panjang.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Aset ber-hash dari Vite: cache lama.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Permissions-Policy "camera=(self)" always;
        try_files $uri =404;
    }

    # SPA: semua rute (/scan-wajah, /hasil, ...) dilayani index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header Permissions-Policy "camera=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
